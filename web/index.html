<!doctype html>
<!--
  Tennis Trainer: browser client for the Split Step Counter API.

  Local:  uvicorn api.main:app --port 8000, then open http://localhost:8000/app/
          (served by the API itself, so API_URL can stay empty).
  Hosted: copy this file to your site, set API_URL to your Lambda Function URL,
          and list your site's origin in the API's ALLOWED_ORIGINS.

  Every element with data-feature="<name>" is removed when GET /v1/features
  reports that feature switched off.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis Trainer</title>
  <style>
    :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2421; --dim:#5f6b66; --line:#dde2de; --accent:#2f7d4f; --warn:#b5651d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141816; --card:#1d2320; --ink:#e6ebe8; --dim:#9aa6a0; --line:#2e3632; --accent:#5cc488; --warn:#e3a35b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
    main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
    .sub { color: var(--dim); margin: 0 0 1.25rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .modes { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
    .modes label { border: 1px solid var(--line); border-radius: 999px; padding: .35rem .85rem; cursor: pointer; }
    .modes input { margin-right: .35rem; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.2rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    select, input[type=file] { font: inherit; color: inherit; }
    .stage { position: relative; margin-top: .75rem; }
    video { display: block; width: 100%; max-height: 24rem; background: #000; border-radius: 8px; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .big { font-size: 2.6rem; font-weight: 700; line-height: 1; }
    .stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: .75rem; }
    .stats div span { display: block; color: var(--dim); font-size: .8rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
    th { color: var(--dim); font-weight: 500; }
    .table-wrap { overflow-x: auto; }
    a.ts { color: var(--accent); cursor: pointer; text-decoration: underline; }
    ul.tips { margin: .5rem 0 0; padding-left: 1.2rem; }
    ul.tips li { margin: .2rem 0; }
    .status { color: var(--dim); min-height: 1.5em; }
    .error { color: var(--warn); }
    .tag { font-size: .75rem; padding: .05rem .4rem; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
    .timeline { position: relative; height: 28px; margin-top: .5rem; border-radius: 6px; background: var(--line); }
    .timeline .mk { position: absolute; top: 3px; width: 6px; height: 22px; margin-left: -3px; border-radius: 3px; border: 0; padding: 0; cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .8rem; color: var(--dim); margin-top: .35rem; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .3rem; vertical-align: -1px; }
    .k-split { background: #2f9e5b; } .k-forehand { background: #2b6cb0; } .k-backhand { background: #8a4fbf; }
    .k-serve { background: #d9822b; } .k-unknown { background: #8a948f; }
    .linkish { background: none; color: var(--dim); border: 1px solid var(--line); padding: .3rem .7rem; font-weight: 400; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Tennis Trainer</h1>
  <p class="sub">Upload a clip. Get split-step counts, stroke metrics and coaching tips.</p>

  <section class="card">
    <h2>1. What are you practising?</h2>
    <div class="modes" id="modes">
      <label data-feature="split_step_counting"><input type="radio" name="mode" value="split" checked>Split steps</label>
      <label data-feature="forehand_training"><input type="radio" name="mode" value="forehand">Forehand</label>
      <label data-feature="backhand_training"><input type="radio" name="mode" value="backhand">Backhand</label>
      <label data-feature="serve_training"><input type="radio" name="mode" value="serve">Serve</label>
      <label data-feature="auto_stroke_detection"><input type="radio" name="mode" value="auto">Match play (auto) <span class="tag">beta</span></label>
    </div>
    <div class="row">
      <label data-feature="stroke_training">Hitting hand
        <select id="hand"><option value="auto">Detect</option><option value="right">Right</option><option value="left">Left</option></select>
      </label>
      <label id="model-picker">Split-step model
        <select id="model">
          <option value="lstm" data-feature="lstm_model">LSTM</option>
          <option value="rules" data-feature="rules_model">Rule-based</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>2. Upload your video</h2>
    <div class="row">
      <input type="file" id="video" accept="video/*">
      <button id="go" disabled>Analyse</button>
    </div>
    <p class="status" id="status"></p>
    <p class="row" id="downloads" data-feature="report_download" hidden>
      <button class="linkish" id="dl-json">Download report (JSON)</button>
      <button class="linkish" id="dl-csv">Download shots (CSV)</button>
    </p>
    <div class="stage" id="stage" hidden>
      <video id="player" controls playsinline></video>
      <canvas id="overlay" data-feature="pose_overlay"></canvas>
    </div>
    <label data-feature="pose_overlay"><input type="checkbox" id="show-skeleton" checked> Show skeleton</label>
    <div id="timeline-box" hidden>
      <div class="timeline" id="timeline" aria-label="Shot timeline"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="card" id="split-results" hidden>
    <h2>Split steps</h2>
    <div class="stats" id="split-stats"></div>
    <div class="table-wrap"><table id="split-table"></table></div>
    <ul class="tips" id="split-tips"></ul>
  </section>

  <section class="card" id="history" data-feature="session_history" hidden>
    <h2>Your progress <span class="tag">saved in this browser</span></h2>
    <div class="table-wrap"><table id="history-table"></table></div>
    <p><button class="linkish" id="clear-history">Clear history</button></p>
  </section>

  <section class="card" id="stroke-results" hidden>
    <h2 id="stroke-title">Strokes</h2>
    <div class="stats" id="stroke-stats"></div>
    <div class="table-wrap"><table id="stroke-table"></table></div>
    <ul class="tips" id="stroke-tips"></ul>
  </section>
</main>

<script>
  // Empty = same origin (page served by the API at /app/). Otherwise e.g.
  // "https://abc123.lambda-url.us-east-1.on.aws" (no trailing slash).
  const API_URL = "";

  const $ = (id) => document.getElementById(id);
  let FLAGS = {};

  // ── Feature switches ─────────────────────────────────────────────────────
  async function loadFeatures() {
    try {
      const r = await fetch(API_URL + "/v1/features");
      FLAGS = (await r.json()).features || {};
    } catch { FLAGS = {}; }  // unreachable API: show everything, errors surface on submit
    document.querySelectorAll("[data-feature]").forEach((el) => {
      if (FLAGS[el.dataset.feature] === false) el.remove();
    });
    const first = document.querySelector('input[name="mode"]');
    if (first) first.checked = true;
    if (!document.querySelector('#model option')) $("model-picker").remove();
    if (!first) $("status").textContent = "All analysis features are switched off on this server.";
    updateControls();
  }

  function mode() { return document.querySelector('input[name="mode"]:checked')?.value; }

  function updateControls() {
    const m = mode();
    const picker = $("model-picker");
    // The split-step model only matters when split steps are counted
    if (picker) picker.hidden = FLAGS.split_step_counting === false;
    $("go").disabled = !m || !$("video").files[0];
  }
  document.addEventListener("change", updateControls);

  // ── API calls ────────────────────────────────────────────────────────────
  async function post(path, body, isJson = true) {
    const r = await fetch(API_URL + path, isJson
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : { method: "POST", body });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${r.status})`);
    return data;
  }

  function queryString() {
    const m = mode(), q = new URLSearchParams();
    if ($("model")) q.set("model", $("model").value);
    if (m !== "split") q.set("drill", m);
    if ($("hand") && m !== "split") q.set("hand", $("hand").value);
    if ($("overlay")) q.set("include_pose", "true");
    return q.toString();
  }

  async function analyse(file) {
    const qs = queryString();
    if (FLAGS.browser_uploads !== false) {
      try {
        const ticket = await post("/v1/upload-url", { filename: file.name });
        if (file.size > ticket.max_bytes) throw new Error(`Video too large (max ${Math.round(ticket.max_bytes / 1048576)} MB).`);
        status("Uploading…");
        const form = new FormData();
        Object.entries(ticket.fields).forEach(([k, v]) => form.append(k, v));
        form.append("file", file);
        const up = await fetch(ticket.url, { method: "POST", body: form });
        if (!up.ok) throw new Error(`Upload failed (${up.status})`);
        status("Analysing… (the first request after a while can take ~20 s)");
        return await post(`/v1/count/s3?${qs}`, { bucket: ticket.bucket, key: ticket.key });
      } catch (e) {
        // 501 = server has no upload bucket (e.g. running locally): fall back to direct upload
        if (!/not configured/.test(e.message) || FLAGS.direct_upload === false) throw e;
      }
    }
    status("Uploading and analysing…");
    const form = new FormData();
    form.append("file", file);
    return post(`/v1/count?${qs}`, form, false);
  }

  // ── Rendering ────────────────────────────────────────────────────────────
  function status(text, isError = false) {
    $("status").textContent = text;
    $("status").className = "status" + (isError ? " error" : "");
  }
  const fmt = (v, digits = 2, unit = "") => (v === null || v === undefined) ? "–" : `${(+v).toFixed(digits)}${unit}`;
  const sec = (ms) => (ms / 1000).toFixed(2) + " s";

  function seekLink(ms) {
    const a = document.createElement("a");
    a.className = "ts"; a.textContent = sec(ms);
    a.onclick = () => { const p = $("player"); p.currentTime = Math.max(0, ms / 1000 - 1); p.play(); };
    return a;
  }

  function stat(label, value) {
    const d = document.createElement("div");
    d.innerHTML = "<span></span><b></b>";
    d.querySelector("span").textContent = label;
    d.querySelector("b").textContent = value;
    return d;
  }

  function fillTable(table, columns, rows) {
    table.replaceChildren();
    const head = table.insertRow();
    columns.forEach(([title]) => { const th = document.createElement("th"); th.textContent = title; head.appendChild(th); });
    rows.forEach((row) => {
      const tr = table.insertRow();
      columns.forEach(([, render]) => {
        const td = tr.insertCell(), v = render(row);
        v instanceof Node ? td.appendChild(v) : (td.textContent = v);
      });
    });
  }

  function fillTips(ul, tips) {
    ul.replaceChildren(...(tips || []).map((t) => { const li = document.createElement("li"); li.textContent = t; return li; }));
  }

  function renderSplit(res) {
    const box = $("split-results");
    box.hidden = res.count === undefined;
    if (box.hidden) return;
    const s = res.session || {};
    $("split-stats").replaceChildren(
      stat("Split steps", res.count),
      ...(s.split_steps_per_minute !== undefined ? [stat("Per minute", fmt(s.split_steps_per_minute, 1))] : []),
      ...(s.interval_s ? [stat("Typical gap", fmt(s.interval_s.median, 1, " s"))] : []),
      ...(s.landing_knee_angle ? [stat("Landing knee bend", fmt(s.landing_knee_angle.median, 0, "°"))] : []),
    );
    const cols = [["Time", (e) => seekLink(e.timestamp_ms)]];
    if (res.timing) cols.push(["", (e) => e.during_swing ? "hop during a swing" : ""]);
    if (res.session) cols.push(
      ["Hop height", (e) => fmt(e.hop_height)],
      ["Knee angle", (e) => fmt(e.landing_knee_angle, 0, "°")],
      ["Stance (× shoulders)", (e) => fmt(e.landing_stance_ratio)]);
    fillTable($("split-table"), cols, res.events);
    fillTips($("split-tips"), s.tips);
  }

  function renderStrokes(res) {
    const box = $("stroke-results");
    box.hidden = !res.strokes;
    if (box.hidden) return;
    const st = res.strokes, serve = st.drill === "serve";
    $("stroke-title").textContent = st.drill === "auto" ? "Strokes" : st.drill[0].toUpperCase() + st.drill.slice(1) + " training";
    const counts = Object.entries(st.summary).map(([k, v]) => stat(k[0].toUpperCase() + k.slice(1) + "s", v.count));
    const scores = Object.entries(st.summary).filter(([, v]) => v.consistency != null)
      .map(([k, v]) => stat(k[0].toUpperCase() + k.slice(1) + " consistency", v.consistency + "/100"));
    const t = res.timing;
    $("stroke-stats").replaceChildren(stat("Swings", st.swings.length), stat("Hand", st.hand), ...counts, ...scores,
      ...(t && t.shots ? [stat("Split step before shot", `${t.shots_with_split_step} of ${t.shots}`)] : []),
      ...(res.rallies && res.rallies.summary.rallies ? [stat("Rallies", res.rallies.summary.rallies),
                                                         stat("Longest rally", res.rallies.summary.longest + " shots")] : []),
      ...(res.recovery && res.recovery.median_recovery_ms != null ? [stat("Recovery", fmt(res.recovery.median_recovery_ms / 1000, 1, " s"))] : []));
    const cols = [["Time", (s) => seekLink(s.timestamp_ms)], ["Stroke", (s) => s.stroke]];
    if (res.rallies) cols.push(["Rally", (s) => s.rally]);
    if (res.recovery) cols.push(["Back to ready", (s) => s.recovery_ms == null ? "–" : fmt(s.recovery_ms / 1000, 1, " s")]);
    cols.push(["Wrist speed", (s) => fmt(s.peak_wrist_speed, 1, " m/s")]);
    if (serve) cols.push(["Reach", (s) => fmt(s.contact_reach_m, 2, " m")], ["Toss", (s) => fmt(s.toss_height_m, 2, " m")],
                         ["Elbow", (s) => fmt(s.elbow_extension, 0, "°")], ["Trophy knee", (s) => fmt(s.trophy_knee_angle, 0, "°")]);
    else cols.push(["Contact height", (s) => fmt(s.contact_height)], ["Shoulder turn", (s) => fmt(s.shoulder_turn_deg, 0, "°")],
                   ["Finish", (s) => fmt(s.finish_above_shoulder_m, 2, " m")], ["Knee load", (s) => fmt(s.load_knee_angle, 0, "°")]);
    if (t) cols.push(["Split step before", (s) => s.split_step_lead_ms == null ? "none" : fmt(s.split_step_lead_ms / 1000, 1, " s")]);
    fillTable($("stroke-table"), cols, st.swings);
    fillTips($("stroke-tips"), [...st.tips, ...(t ? t.tips : []), ...(res.rallies ? res.rallies.summary.tips : []),
                                 ...(res.recovery ? res.recovery.tips : [])]);
  }

  // ── Timeline ─────────────────────────────────────────────────────────────
  // ── Skeleton overlay ─────────────────────────────────────────────────────
  let POSE = null;  // res.pose: {landmarks, edges, ts_ms, xy}

  function poseAt(ms) {
    const ts = POSE.ts_ms;
    let lo = 0, hi = ts.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; ts[mid] < ms ? (lo = mid + 1) : (hi = mid); }
    if (lo > 0 && Math.abs(ts[lo - 1] - ms) < Math.abs(ts[lo] - ms)) lo--;
    return Math.abs(ts[lo] - ms) <= 100 ? POSE.xy[lo] : null;  // nothing if no frame within 100 ms
  }

  function drawOverlay() {
    const c = $("overlay"), v = $("player");
    if (!c) return;
    const ctx = c.getContext && c.getContext("2d");
    if (!ctx) return;
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w; c.height = h;
    ctx.clearRect(0, 0, w, h);
    if (!POSE || !$("show-skeleton").checked || !v.videoWidth) return;
    const pts = poseAt(v.currentTime * 1000);
    if (!pts) return;
    // The video is letterboxed inside the element (object-fit: contain)
    const scale = Math.min(w / v.videoWidth, h / v.videoHeight);
    const dw = v.videoWidth * scale, dh = v.videoHeight * scale, ox = (w - dw) / 2, oy = (h - dh) / 2;
    const at = (i) => pts[2 * i] < 0 ? null : [ox + pts[2 * i] * dw, oy + pts[2 * i + 1] * dh];
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(92, 196, 136, .9)"; ctx.fillStyle = "#fff";
    for (const [a, b] of POSE.edges) {
      const p1 = at(a), p2 = at(b);
      if (p1 && p2) { ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...p2); ctx.stroke(); }
    }
    for (let i = 0; i < POSE.landmarks.length; i++) {
      const q = at(i);
      if (q) { ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 2 * Math.PI); ctx.fill(); }
    }
  }

  function overlayLoop() {
    drawOverlay();
    const v = $("player");
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(overlayLoop);
    else if (!v.paused) requestAnimationFrame(overlayLoop);
  }
  $("player").addEventListener("play", overlayLoop);
  ["seeked", "pause", "loadedmetadata"].forEach((ev) => $("player").addEventListener(ev, drawOverlay));
  window.addEventListener("resize", drawOverlay);
  $("show-skeleton")?.addEventListener("change", drawOverlay);

  const KIND_LABEL = { split: "Split step", forehand: "Forehand", backhand: "Backhand", serve: "Serve", unknown: "Swing" };

  function renderTimeline(res) {
    const marks = [
      ...(res.events || []).filter((e) => !e.during_swing).map((e) => ["split", e.timestamp_ms]),
      ...(res.strokes ? res.strokes.swings.map((s) => [s.stroke, s.timestamp_ms]) : []),
    ];
    const box = $("timeline-box");
    box.hidden = !marks.length || !res.duration_ms;
    if (box.hidden) return;
    $("timeline").replaceChildren(...marks.map(([kind, ms]) => {
      const b = document.createElement("button");
      b.className = "mk k-" + kind;
      b.style.left = Math.min(100, (ms / res.duration_ms) * 100) + "%";
      b.title = `${KIND_LABEL[kind] || kind} at ${sec(ms)}`;
      b.setAttribute("aria-label", b.title);
      b.onclick = () => seekLink(ms).onclick();
      return b;
    }));
    const kinds = [...new Set(marks.map(([k]) => k))];
    $("legend").replaceChildren(...kinds.map((k) => {
      const span = document.createElement("span");
      span.innerHTML = `<i class="k-${k}"></i>`;
      span.append(KIND_LABEL[k] || k);
      return span;
    }));
  }

  // ── Report download ──────────────────────────────────────────────────────
  let LAST = null;  // {res, file}

  function download(name, type, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function toCsv(res) {
    const rows = [
      ...(res.events || []).map((e) => ({ type: e.during_swing ? "swing hop" : "split step", ...e })),
      ...(res.strokes ? res.strokes.swings.map((s) => ({ type: s.stroke, ...s })) : []),
    ].sort((a, b) => a.timestamp_ms - b.timestamp_ms);
    const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))];
    const cell = (v) => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    return [cols.join(","), ...rows.map((r) => cols.map((c) => cell(r[c])).join(","))].join("\n") + "\n";
  }

  function reportName(ext) {
    const base = LAST.file.replace(/\.[^.]+$/, "").replace(/[^\w-]+/g, "_").slice(0, 40) || "session";
    return `${base}-tennis-report.${ext}`;
  }

  // ── Session history (this browser only) ──────────────────────────────────
  const HISTORY_KEY = "tennis-trainer-history-v1", HISTORY_MAX = 50;

  function readHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  }
  function writeHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX))); } catch { /* storage off */ }
  }

  function summarise(res, fileName, modeName) {
    const med = (o) => (o && o.median !== undefined ? o.median : null);
    const sw = res.strokes ? res.strokes.summary : {};
    const strokeMed = (key) => {
      const vals = Object.values(sw).map((v) => med(v[key])).filter((v) => v !== null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };
    return {
      date: new Date().toISOString(), file: fileName, mode: modeName,
      split_steps: res.count ?? null,
      knee: med(res.session && res.session.landing_knee_angle),
      swings: res.strokes ? res.strokes.swings.length : null,
      contact: strokeMed("contact_height"),
      speed: strokeMed("peak_wrist_speed"),
      with_split: res.timing && res.timing.shots ? res.timing.fraction_with_split_step : null,
    };
  }

  function renderHistory() {
    const box = $("history");
    if (!box) return;  // feature switched off
    const list = readHistory();
    box.hidden = !list.length;
    fillTable($("history-table"), [
      ["Date", (h) => new Date(h.date).toLocaleDateString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })],
      ["Mode", (h) => KIND_LABEL[h.mode] || (h.mode === "auto" ? "Match play" : h.mode)],
      ["Clip", (h) => h.file],
      ["Split steps", (h) => h.split_steps ?? "–"],
      ["Landing knee", (h) => fmt(h.knee, 0, "°")],
      ["Swings", (h) => h.swings ?? "–"],
      ["Contact height", (h) => fmt(h.contact)],
      ["Wrist speed", (h) => fmt(h.speed, 1, " m/s")],
      ["Split step before shot", (h) => h.with_split == null ? "–" : Math.round(h.with_split * 100) + "%"],
    ], list);
  }

  function saveToHistory(res, fileName, modeName) {
    if (!$("history")) return;
    writeHistory([summarise(res, fileName, modeName), ...readHistory()]);
    renderHistory();
  }

  // ── Wiring ───────────────────────────────────────────────────────────────
  $("video").addEventListener("change", () => {
    const f = $("video").files[0], p = $("player");
    if (f) { p.src = URL.createObjectURL(f); $("stage").hidden = false; }
    POSE = null; drawOverlay();
    updateControls();
  });

  $("go").addEventListener("click", async () => {
    const file = $("video").files[0];
    $("go").disabled = true;
    $("split-results").hidden = $("stroke-results").hidden = true;
    try {
      const res = await analyse(file);
      status(`Done in ${res.processing_s}s · ${res.frames} frames`);
      renderSplit(res);
      renderStrokes(res);
      renderTimeline(res);
      POSE = res.pose || null; drawOverlay();
      saveToHistory(res, file.name, mode());
      LAST = { res, file: file.name };
      if ($("downloads")) $("downloads").hidden = false;
    } catch (e) {
      status("Error: " + e.message, true);
    } finally {
      updateControls();
    }
  });

  $("clear-history")?.addEventListener("click", () => { writeHistory([]); renderHistory(); });
  $("dl-json")?.addEventListener("click", () => download(reportName("json"), "application/json", JSON.stringify(LAST.res, null, 2)));
  $("dl-csv")?.addEventListener("click", () => download(reportName("csv"), "text/csv", toCsv(LAST.res)));
  loadFeatures().then(renderHistory);
</script>
</body>
</html>
