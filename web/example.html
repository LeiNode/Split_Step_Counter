<!doctype html>
<!--
  Minimal browser client for the Split Step Counter API.
  Copy the <script> into your own site and set API_URL to your Lambda Function URL.
  Your site's origin must be listed in the API's ALLOWED_ORIGINS.

  Flow: ask the API for a presigned S3 upload -> upload the video straight to
  S3 (so large files never pass through Lambda) -> ask the API to count it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Step Counter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
    button { padding: .5rem 1rem; }
    #count { font-size: 3rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Split Step Counter</h1>
  <p><input type="file" id="video" accept="video/*"></p>
  <p>
    <label>Model
      <select id="model">
        <option value="lstm">LSTM</option>
        <option value="rules">Rule-based</option>
      </select>
    </label>
    <button id="go">Count split steps</button>
  </p>
  <p id="status"></p>
  <div id="count"></div>
  <ul id="events"></ul>

  <script>
    const API_URL = "https://YOUR-FUNCTION-ID.lambda-url.YOUR-REGION.on.aws"; // no trailing slash

    const $ = (id) => document.getElementById(id);

    async function api(path, body) {
      const r = await fetch(API_URL + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || `${path} failed (${r.status})`);
      return data;
    }

    async function countSplitSteps(file, model) {
      // 1. Get a one-time upload slot
      const ticket = await api("/v1/upload-url", { filename: file.name });
      if (file.size > ticket.max_bytes) {
        throw new Error(`Video is too large (max ${Math.round(ticket.max_bytes / 1048576)} MB).`);
      }

      // 2. Upload directly to S3 (policy fields first, file last)
      $("status").textContent = "Uploading…";
      const form = new FormData();
      Object.entries(ticket.fields).forEach(([k, v]) => form.append(k, v));
      form.append("file", file);
      const up = await fetch(ticket.url, { method: "POST", body: form });
      if (!up.ok) throw new Error(`Upload failed (${up.status})`);

      // 3. Count
      $("status").textContent = "Analyzing… (the first request after a while can take ~20 s)";
      return api(`/v1/count/s3?model=${model}`, { bucket: ticket.bucket, key: ticket.key });
    }

    $("go").addEventListener("click", async () => {
      const file = $("video").files[0];
      if (!file) { $("status").textContent = "Choose a video first."; return; }
      $("go").disabled = true;
      $("count").textContent = "";
      $("events").innerHTML = "";
      try {
        const result = await countSplitSteps(file, $("model").value);
        $("status").textContent = `Done in ${result.processing_s}s`;
        $("count").textContent = `${result.count} split step${result.count === 1 ? "" : "s"}`;
        for (const e of result.events) {
          const li = document.createElement("li");
          li.textContent = `at ${(e.timestamp_ms / 1000).toFixed(2)} s`;
          $("events").appendChild(li);
        }
      } catch (err) {
        $("status").textContent = "Error: " + err.message;
      } finally {
        $("go").disabled = false;
      }
    });
  </script>
</body>
</html>
